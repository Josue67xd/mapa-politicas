<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Políticas Objetivo</title>
<style>
:root{
  --bg:#07111f; --panel:#0d1a2b; --panel2:#112238; --text:#f4f7fb; --muted:#9fb0c5;
  --line:#2a3d55; --accent:#5ea6ff; --accent2:#80c7ff; --good:#7ed6b4; --card:#0f2034;
  --shadow:0 20px 60px rgba(0,0,0,.28);
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-spring:cubic-bezier(.3,1.22,.44,1.02);
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 50% -10%,#102845 0,#07111f 45%,#050b13 100%);color:var(--text);font-family:Inter,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
button,input{font:inherit}
button{cursor:pointer}
*{scrollbar-width:thin;scrollbar-color:#2c4a68 transparent}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#28425e;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#3d6089}
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;display:flex;align-items:center;gap:14px;padding:0 22px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(6,14,25,.8);backdrop-filter:blur(12px);position:sticky;top:0;z-index:2000}
.brand{display:flex;align-items:center;gap:11px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.brand-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(145deg,#66b0ff,#286dc7);display:grid;place-items:center;box-shadow:0 8px 22px rgba(46,125,215,.25);transition:transform .3s var(--ease-spring)}
.brand:hover .brand-mark{transform:rotate(-6deg) scale(1.06)}
.brand-mark svg{width:18px;height:18px}
.sep{width:1px;height:28px;background:rgba(255,255,255,.10)}
.breadcrumb{min-width:0;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;overflow:hidden}
.crumb{border:0;background:transparent;color:inherit;padding:6px 8px;border-radius:7px;white-space:nowrap;transition:background .2s var(--ease),color .2s var(--ease)}
.crumb:hover{background:rgba(255,255,255,.06);color:#fff}
.crumb.current{color:#fff}
.actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{height:38px;min-width:38px;border:1px solid rgba(255,255,255,.10);background:#0d1b2d;color:#dce8f6;border-radius:10px;padding:0 12px;display:flex;align-items:center;gap:8px;transition:border-color .22s var(--ease),background .22s var(--ease),transform .22s var(--ease)}
.icon-btn:hover{border-color:#42658c;background:#12243b;transform:translateY(-1px)}
.icon-btn:active{transform:translateY(0) scale(.97)}
.search{position:relative}
.search input{width:260px;height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.11);background:#0a1828;color:#fff;padding:0 14px 0 36px;outline:none;transition:border-color .22s var(--ease),box-shadow .22s var(--ease)}
.search input:focus{border-color:#5797db;box-shadow:0 0 0 3px rgba(87,151,219,.14)}
.search svg{position:absolute;left:11px;top:11px;width:16px;height:16px;color:#8195ac}
.workspace{position:relative;flex:1;min-height:calc(100vh - 68px);overflow:hidden}
.workspace::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.28;
  background-image:
    radial-gradient(circle at center,rgba(94,166,255,.10) 0 1px,transparent 1.5px),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:34px 34px,34px 34px,34px 34px;
  mask-image:radial-gradient(circle at center,black 0%,rgba(0,0,0,.7) 42%,transparent 82%);
}
.canvas{position:absolute;inset:0;display:grid;place-items:center;padding:45px;transition:opacity .2s var(--ease),transform .4s var(--ease),filter .22s var(--ease);will-change:opacity,transform,filter}
.canvas.exit{opacity:0;transform:scale(.975);filter:blur(3px)}
.stage{width:min(1180px,100%);height:min(720px,calc(100vh - 120px));min-height:560px;position:relative}
.stage svg{width:100%;height:100%;overflow:visible}
.edge{stroke:#29425f;stroke-width:1.4;fill:none;opacity:0;stroke-dasharray:5 7;animation:dash 20s linear infinite,edgeIn .5s var(--ease) .1s both}
@keyframes dash{to{stroke-dashoffset:-200}}
@keyframes edgeIn{to{opacity:.85}}
.node{position:absolute;z-index:2;transform:translate(-50%,-50%);border:1px solid #294562;background:linear-gradient(180deg,#10243a,#0b1a2a);color:#ecf5ff;border-radius:16px;min-width:170px;max-width:245px;padding:14px 15px;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.18);transition:transform .3s var(--ease),border-color .24s var(--ease),background .24s var(--ease),box-shadow .3s var(--ease),filter .22s var(--ease);animation:pop .5s var(--ease) both;will-change:transform,opacity}
.node:hover,.node:focus-visible{transform:translate(-50%,-50%) scale(1.065);border-color:#5d94ce;background:#122942;box-shadow:0 20px 46px rgba(0,0,0,.36);outline:none;z-index:60;filter:brightness(1.05)}
.node:focus-visible{box-shadow:0 20px 46px rgba(0,0,0,.36),0 0 0 3px rgba(94,166,255,.4)}
.node:active{transform:translate(-50%,-50%) scale(1.02)}
.node .kicker{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#78b7f5;margin-bottom:6px;font-weight:700}
.node .title{font-size:14px;line-height:1.25;font-weight:650}
.node .meta{font-size:11px;color:#8fa5bc;margin-top:7px}
.node.center{z-index:5;min-width:230px;text-align:center;padding:20px;border-radius:22px;border-color:#4f8ac8;background:linear-gradient(145deg,#173558,#0f2741);box-shadow:0 18px 50px rgba(33,103,174,.24)}
.node.center .title{font-size:24px;letter-spacing:.01em}
.node.center .kicker{color:#91c8ff}
.node.root{min-width:280px;padding:24px}
.node.root .title{font-size:30px}
.node.root-text{
  border:0!important;background:transparent!important;box-shadow:none!important;
  min-width:auto!important;max-width:none!important;padding:10px 18px!important;
  color:#f6f9fd;
}
.node.root-text:hover,.node.root-text:focus-visible{
  background:transparent!important;box-shadow:none!important;border-color:transparent!important;
  transform:translate(-50%,-50%) scale(1.03)!important;filter:brightness(1.12)
}
.node.root-text .title{
  font-size:46px!important;font-weight:760;letter-spacing:.08em;text-shadow:0 10px 36px rgba(0,0,0,.28);
}
.node.gateway-text{
  border:0!important;background:transparent!important;box-shadow:none!important;
  min-width:auto!important;max-width:none!important;padding:10px 18px!important;
}
.node.gateway-text:hover,.node.gateway-text:focus-visible{
  background:transparent!important;box-shadow:none!important;border-color:transparent!important;
  transform:translate(-50%,-50%) scale(1.03)!important;filter:brightness(1.12)
}
.node.gateway-text .title{font-size:40px!important;font-weight:740;letter-spacing:.06em}
.gateway-copy{position:absolute;left:50%;top:67%;transform:translateX(-50%);width:min(700px,84%);text-align:center;z-index:4;color:#9fb0c5;line-height:1.55;font-size:14px;animation:fadeUp .5s var(--ease) both}
.gateway-copy strong{color:#dce9f7;font-weight:700}
.gateway-options{position:absolute;left:50%;top:42%;width:min(560px,90%);transform:translate(-50%,-50%);display:flex;justify-content:center;align-items:stretch;gap:24px;z-index:5;animation:gatewayIn .5s var(--ease) both}
.gateway-option{position:relative!important;left:auto!important;top:auto!important;transform:none!important;flex:1;min-width:0;max-width:none;text-align:center!important;border-radius:18px!important;padding:18px 20px!important;animation:optionIn .42s var(--ease) both!important}
.gateway-option:hover,.gateway-option:focus-visible{transform:translateY(-5px) scale(1.02)!important;box-shadow:0 20px 46px rgba(0,0,0,.36)!important}
.gateway-option:active{transform:translateY(-1px) scale(.99)!important}
.gateway-option .title{font-size:18px!important;letter-spacing:.02em!important}
.gateway-option .meta{font-size:11px;color:#8fa5bc;margin-top:7px}
.gateway-option.comparison{border-color:#4c8bc8;background:linear-gradient(145deg,#163452,#0d2238)}
.gateway-option.comparison:hover{border-color:#80c7ff;background:#173b60}
.comparison-view{width:min(1450px,100%);margin:0 auto;padding-bottom:28px;animation:comparisonIn .42s var(--ease) both}
.comparison-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:18px}
.comparison-title{font-size:25px;font-weight:750;letter-spacing:-.02em}
.comparison-subtitle{color:#91a6bb;font-size:13px;line-height:1.45;margin-top:5px}
.comparison-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;padding:12px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(13,29,47,.78)}
.comparison-filters select,.comparison-filters input{height:36px;border:1px solid #294562;background:#0a192a;color:#eaf3fc;border-radius:9px;padding:0 10px;outline:none;transition:border-color .22s var(--ease),box-shadow .22s var(--ease)}
.comparison-filters input{min-width:230px}
.comparison-filters select:focus,.comparison-filters input:focus{border-color:#5797db;box-shadow:0 0 0 3px rgba(87,151,219,.14)}
.heat-wrap{overflow:auto;border:1px solid #294562;border-radius:16px;background:rgba(9,23,38,.92);box-shadow:var(--shadow)}
.heat-table{width:100%;min-width:0;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:12px}
.heat-table th{position:sticky;top:0;background:#123250;color:#dcecff;text-align:left;font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:11px 10px;border-bottom:1px solid #3a6d99;white-space:nowrap;z-index:2}
.heat-table th.wrap{white-space:normal;line-height:1.3}
.heat-table td{padding:10px;border-bottom:1px solid rgba(137,174,207,.12);color:#dce8f4;vertical-align:middle;transition:background .18s var(--ease)}
.heat-table tbody tr{cursor:pointer;transition:background .18s var(--ease)}
.heat-table tbody tr:nth-child(even){background:rgba(78,151,218,.045)}
.heat-table tbody tr:hover{background:rgba(78,151,218,.15)}
.heat-table tbody tr:hover td{color:#f4f9ff}
.heat-table tbody tr:focus-visible{outline:2px solid rgba(94,166,255,.5);outline-offset:-2px}
.heat-table .num{text-align:center;color:#91c8ff;font-weight:700;width:45px}
.heat-table .policy-name{color:#f2f7fc;font-weight:650}
.heat-table th:nth-child(1),.heat-table td:nth-child(1){width:4%}.heat-table th:nth-child(2),.heat-table td:nth-child(2){width:31%}.heat-table th:nth-child(3),.heat-table td:nth-child(3){width:14%}.heat-table th:nth-child(4),.heat-table td:nth-child(4){width:16%}.heat-table th:nth-child(5),.heat-table td:nth-child(5){width:8%}.heat-table th:nth-child(6),.heat-table td:nth-child(6){width:11%}.heat-table th:nth-child(7),.heat-table td:nth-child(7){width:7%}.heat-table th:nth-child(8),.heat-table td:nth-child(8){width:9%}
.heat-table td{overflow-wrap:anywhere}
.heat-cell{min-width:80px;text-align:center;border-left:1px solid rgba(255,255,255,.08);font-weight:750;transition:filter .18s var(--ease)}
tr:hover .heat-cell{filter:brightness(1.12)}
.heat-cell.low{background:rgba(73,183,138,.2);color:#a9f0cf}.heat-cell.medium{background:rgba(242,190,79,.22);color:#ffe4a0}.heat-cell.high{background:rgba(239,137,76,.25);color:#ffd0ad}.heat-cell.critical{background:rgba(226,83,100,.28);color:#ffc1c9}
.attention{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;white-space:nowrap;transition:transform .18s var(--ease)}
tr:hover .attention{transform:scale(1.05)}
.attention.Baja{background:rgba(73,183,138,.16);color:#9be5c6}.attention.Media{background:rgba(242,190,79,.17);color:#ffe09a}.attention.Alta{background:rgba(239,137,76,.18);color:#ffbd96}.attention.Crítica{background:rgba(226,83,100,.2);color:#ffb4bd}
.result-count{color:#8197ad;font-size:12px;margin-left:auto;align-self:center}
.workspace.comparison-mode{overflow:hidden}
.workspace.comparison-mode .canvas{position:absolute;inset:0;display:block;overflow:hidden;padding:28px 32px}
.workspace.comparison-mode .stage{width:100%;height:100%;min-height:0;position:relative}
.workspace.comparison-mode .comparison-view{height:100%;overflow:hidden}
.workspace.comparison-mode .heat-wrap{height:calc(100% - 148px);overflow:auto}
.workspace.comparison-mode .legend{display:none}
.comparison-details{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.10)}
.detail-text.compact{font-size:14px;line-height:1.5;margin-bottom:16px}
.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:4px}
.score-item{border:1px solid #2d4d69;background:#0b1d30;border-radius:10px;padding:8px 7px;text-align:center}.score-item b{display:block;color:#8da8c0;font-size:9px;text-transform:uppercase;letter-spacing:.05em}.score-item span{display:block;color:#f0c875;font-size:17px;font-weight:800;margin-top:4px}
.score-heatmap{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:4px}
.criterion-cell{appearance:none;position:relative;border:1px solid #2d4d69;background:#0b1d30;color:#fff;border-radius:11px;padding:10px 8px;text-align:left;cursor:pointer;transition:transform .2s var(--ease),border-color .2s var(--ease),filter .2s var(--ease)}
.criterion-cell:hover,.criterion-cell:focus-visible{transform:translateY(-2px);border-color:#8fc5ff;filter:brightness(1.16);outline:none}
.criterion-cell .criterion-name{display:block;color:#a8bfd3;font-size:9px;line-height:1.15;text-transform:uppercase;letter-spacing:.04em}.criterion-cell .criterion-value{display:block;color:#f8d27f;font-size:20px;font-weight:800;margin-top:4px}.criterion-cell.low{background:linear-gradient(135deg,rgba(53,157,129,.34),rgba(11,29,48,.92))}.criterion-cell.medium{background:linear-gradient(135deg,rgba(211,166,55,.34),rgba(11,29,48,.92))}.criterion-cell.high{background:linear-gradient(135deg,rgba(215,108,61,.38),rgba(11,29,48,.92))}.criterion-cell.critical{background:linear-gradient(135deg,rgba(193,67,86,.42),rgba(11,29,48,.92))}
.criterion-tooltip{position:fixed;width:min(290px,calc(100vw - 24px));padding:10px 11px;border:1px solid #4a6f91;border-radius:10px;background:#102943;color:#dce8f4;font-size:12px;font-weight:400;line-height:1.4;text-align:left;box-shadow:0 14px 35px rgba(0,0,0,.42);z-index:2500;pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .18s var(--ease),transform .18s var(--ease)}
.criterion-tooltip.visible{opacity:1;transform:translateY(0)}
.related-list{margin:0 0 16px;padding-left:20px;color:#dce8f4;font-size:14px;line-height:1.5}.related-list li{padding-left:3px;margin:4px 0}.related-list li::marker{color:#8fc5ff}
@media(max-width:820px){.gateway-options{gap:12px;width:min(500px,94%)}.gateway-option{min-width:0;padding:15px 12px!important}.gateway-option .title{font-size:15px!important}.workspace.comparison-mode .canvas{padding:20px 14px}.comparison-head{display:block}.comparison-filters input{min-width:180px}.score-grid{grid-template-columns:repeat(2,1fr)}}
.node.category{min-width:150px;max-width:190px;padding:12px 13px;z-index:4}
.node.category:hover,.node.category:focus-visible{z-index:70}
.node.category .title{font-size:12.5px}
.node.policy{min-width:210px;max-width:270px}
.node.policy .title{font-size:13px}
.node .count{display:inline-flex;align-items:center;justify-content:center;margin-top:8px;height:24px;min-width:24px;padding:0 7px;border-radius:999px;background:rgba(92,166,255,.12);color:#8fc5ff;font-size:11px;font-weight:700;transition:background .2s var(--ease),color .2s var(--ease)}
.node:hover .count{background:rgba(92,166,255,.22);color:#bcdcff}
@keyframes pop{from{opacity:0;filter:blur(2px);transform:translate(-50%,-50%) scale(.9) translateY(6px)}to{opacity:1;filter:blur(0);transform:translate(-50%,-50%) scale(1) translateY(0)}}
.hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:12px;color:#7389a3;background:rgba(8,19,32,.72);border:1px solid rgba(255,255,255,.07);padding:8px 12px;border-radius:999px;backdrop-filter:blur(8px);transition:opacity .3s var(--ease)}
.modal-backdrop{position:absolute;inset:0;background:rgba(2,8,15,.72);backdrop-filter:blur(7px);z-index:900;opacity:0;pointer-events:none;transition:opacity .3s var(--ease);will-change:opacity}
.modal-backdrop.open{opacity:1;pointer-events:auto}
.workspace.modal-open .node{pointer-events:none}
.workspace.modal-open .sidepanel,.workspace.modal-open .modal-backdrop{pointer-events:auto}
.sidepanel{
  position:absolute;left:50%;top:50%;width:min(620px,calc(100% - 36px));
  background:linear-gradient(180deg,rgba(14,31,50,.99),rgba(9,22,37,.99));
  border:1px solid #355673;border-radius:24px;box-shadow:0 28px 90px rgba(0,0,0,.48);
  padding:30px 32px;z-index:1000;opacity:0;pointer-events:none;max-height:calc(100% - 36px);overflow:auto;
  transform:translate(-50%,-47%) scale(.95);transition:opacity .28s var(--ease),transform .4s var(--ease-spring);will-change:opacity,transform
}
.sidepanel.open{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
.sidepanel::before{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;background:radial-gradient(circle at 50% 0,rgba(94,166,255,.09),transparent 42%)}
.sidepanel .close{position:absolute;right:14px;top:14px;width:34px;height:34px;border:1px solid rgba(255,255,255,.1);background:#12243a;color:#cfe0f2;border-radius:10px;transition:border-color .2s var(--ease),background .2s var(--ease),transform .2s var(--ease)}
.sidepanel .close:hover{border-color:#5d94ce;background:#183355;transform:rotate(90deg)}
.badge{display:inline-flex;padding:6px 9px;border-radius:999px;background:rgba(94,166,255,.12);color:#8fc5ff;font-size:11px;font-weight:700;margin-bottom:14px}
.sidepanel h2{margin:0 44px 12px 0;font-size:29px;line-height:1.2;letter-spacing:-.02em}
.sidepanel .family{color:#8ea5bd;font-size:13px;margin-bottom:22px}
.detail-label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#7293b5;font-weight:700;margin-bottom:7px}
.detail-text{font-size:15px;line-height:1.58;color:#dce7f3;margin-bottom:20px}
.area-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #31516f;background:#0f2236;border-radius:12px;padding:9px 12px;color:#cbe3fb;font-weight:700}
.results{position:absolute;top:58px;right:0;width:360px;max-height:430px;overflow:auto;background:#091828;border:1px solid #29425f;border-radius:14px;box-shadow:var(--shadow);padding:8px;z-index:2100;opacity:0;pointer-events:none;transform:translateY(-6px) scale(.98);transition:opacity .2s var(--ease),transform .22s var(--ease)}
.results.show{opacity:1;pointer-events:auto;transform:translateY(0) scale(1)}
.result{width:100%;text-align:left;border:0;background:transparent;color:#eaf3fc;padding:11px 12px;border-radius:10px;transition:background .16s var(--ease)}
.result:hover{background:#10263d}
.result small{display:block;color:#8199b1;margin-top:4px}
.empty{padding:16px;color:#8298af;text-align:center;font-size:13px}
.zoom{position:absolute;left:22px;bottom:22px;display:flex;gap:8px;z-index:10}
.legend{position:absolute;left:22px;top:22px;color:#7790aa;font-size:12px;line-height:1.5;transition:opacity .3s var(--ease)}

.hero-copy{position:absolute;left:50%;top:68%;transform:translateX(-50%);text-align:center;width:min(620px,82%);z-index:4;pointer-events:none;animation:fadeUp .55s var(--ease) both}
.hero-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6f94ba;font-weight:800;margin-bottom:10px}
.hero-title{font-size:15px;color:#b8c7d8;line-height:1.5;margin-bottom:10px}
.hero-meta{font-size:12px;color:#6f849a}
.hero-ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(94,166,255,.12);border-radius:50%;pointer-events:none;animation:ringIn .7s var(--ease) both,ringPulse 7s ease-in-out 1s infinite}
.hero-ring.r1{width:420px;height:420px}
.hero-ring.r2{width:590px;height:590px;border-color:rgba(94,166,255,.07);animation:ringIn .7s var(--ease) .06s both,ringPulse 7s ease-in-out 1.4s infinite}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes ringIn{from{opacity:0;transform:translate(-50%,-50%) scale(.88)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ringPulse{0%,100%{opacity:.55}50%{opacity:.9}}
@keyframes gatewayIn{from{opacity:0;transform:translate(-50%,-44%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes comparisonIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes optionIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}

@media(max-width:820px){
  .search input{width:170px}
  .brand span{display:none}
  .sep{display:none}

function setBreadcrumb(){
  const parts=[['Políticas',()=>goRoot()]];
  if(view.type==='comparison') parts.push(['Comparación',()=>renderComparison()]);
  if(view.type==='categories' || view.type==='family') parts.push(['Categorías',()=>goCategories()]);
  if(view.family) parts.push([view.family,()=>goFamily(view.family)]);
  breadcrumb.innerHTML='';
  parts.forEach((p,i)=>{
    const b=document.createElement('button');
    b.type='button'; b.className='crumb'+(i===parts.length-1?' current':'');
    b.textContent=p[0]; b.addEventListener('click',p[1]);
    breadcrumb.appendChild(b);
    if(i<parts.length-1){ const s=document.createElement('span'); s.textContent='›'; breadcrumb.appendChild(s); }
  });
}
function animateSwap(fn){
  let done=false;
  const finish=()=>{
    if(done) return; done=true;
    canvas.removeEventListener('transitionend',onEnd);
    fn();
    requestAnimationFrame(()=>requestAnimationFrame(()=>canvas.classList.remove('exit')));
  };
  const onEnd=e=>{ if(e.target===canvas && e.propertyName==='opacity') finish(); };
  canvas.addEventListener('transitionend',onEnd);
  canvas.classList.add('exit');
  setTimeout(finish,260);
}
function clearStage(){ stage.innerHTML=''; sidepanel.classList.remove('open'); modalBackdrop.classList.remove('open'); document.querySelector('.workspace').classList.remove('comparison-mode','modal-open'); }
function edgeSvg(lines){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 1000 620'); svg.setAttribute('preserveAspectRatio','none');
  lines.forEach(([x1,y1,x2,y2],i)=>{
    const l=document.createElementNS('http://www.w3.org/2000/svg','path');
    const mx=(x1+x2)/2;
    l.setAttribute('d',`M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    l.setAttribute('class','edge'); l.style.animationDelay=`${i*14}ms, 0ms`;
    svg.appendChild(l);
  });
  stage.appendChild(svg);
}
function makeNode({x,y,title,kicker='',meta='',cls='',count=null,onClick,delay=0}){
  const b=document.createElement('button');
  b.type='button'; b.className='node '+cls; b.style.left=x+'%'; b.style.top=y+'%'; b.style.animationDelay=delay+'ms';
  b.innerHTML=(kicker?`<div class="kicker">${esc(kicker)}</div>`:'')+`<div class="title">${esc(title)}</div>`+(meta?`<div class="meta">${esc(meta)}</div>`:'')+(count!==null?`<span class="count">${count}</span>`:'');
  b.addEventListener('click',onClick); stage.appendChild(b); return b;
}
function goRoot(){
  animateSwap(()=>{
    view={type:'root',family:null}; clearStage(); setBreadcrumb();

    const r1=document.createElement('div'); r1.className='hero-ring r1'; stage.appendChild(r1);
    const r2=document.createElement('div'); r2.className='hero-ring r2'; stage.appendChild(r2);

    makeNode({x:50,y:41,title:'POLÍTICAS',cls:'root-text',onClick:showCategoryGateway});

    const copy=document.createElement('div');
    copy.className='hero-copy';
    copy.innerHTML=`
      <div class="hero-eyebrow">Arquitectura objetivo</div>
      <div class="hero-title">Mapa conceptual interactivo de la estructura propuesta de políticas</div>
      <div class="hero-meta">${families.length} categorías · ${POLICIES.length} políticas objetivo</div>`;
    stage.appendChild(copy);

    document.getElementById('legend').textContent='Punto de partida del mapa conceptual.';
    document.getElementById('hint').textContent='Haz clic en Políticas para continuar';
  });
}
function showCategoryGateway(){
  animateSwap(()=>{
    view={type:'gateway',family:null}; clearStage(); setBreadcrumb();

    const r1=document.createElement('div'); r1.className='hero-ring r1'; stage.appendChild(r1);

    const options=document.createElement('div'); options.className='gateway-options'; stage.appendChild(options);
    const categoriesButton=makeNode({x:50,y:42,title:'CATEGORÍAS',meta:'Explorar la arquitectura',cls:'gateway-option',delay:0,onClick:goCategories});
    const comparisonButton=makeNode({x:50,y:42,title:'COMPARACIÓN',meta:'Ver el mapa de calor',cls:'gateway-option comparison',delay:90,onClick:renderComparison});
    options.appendChild(categoriesButton); options.appendChild(comparisonButton);
    categoriesButton.style.position='relative'; categoriesButton.style.left='auto'; categoriesButton.style.top='auto'; categoriesButton.style.transform='none';
    comparisonButton.style.position='relative'; comparisonButton.style.left='auto'; comparisonButton.style.top='auto'; comparisonButton.style.transform='none';

    const copy=document.createElement('div');
    copy.className='gateway-copy';
    copy.innerHTML=`Elegimos clasificar la arquitectura objetivo en <strong>${families.length} categorías</strong> para agrupar las políticas por función, riesgo y responsabilidad dentro de la Empresa Principal. Cada categoría reúne las políticas que responden a una misma necesidad de gestión.`;
    stage.appendChild(copy);

    document.getElementById('legend').textContent='Segundo nivel del mapa conceptual.';
    document.getElementById('hint').textContent='Elige Categorías para explorar o Comparación para ver el mapa de calor';
  });
}

const formatAreas=s=>String(s||'').split('/').map(x=>x.trim()).filter(Boolean).map(x=>`${x} - ${AREA_NAMES[x]||x}`).join(' / ');
const attentionClass = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const heatClass = s => ({'Baja':'low','Media':'medium','Alta':'high','Crítica':'critical'}[s]||'medium');
const scoreHeatClass=(label,value)=>{
  const n=Number(value)||0;
  if(['Regulatorio','Operativo','Financiero / reputacional','Brecha','Problema documental'].includes(label)) return n<=2?'low':n===3?'medium':n===4?'high':'critical';
  const max={Criticidad:15,Intervención:10,'Puntaje total':25}[label]||5;
  const pct=n/max;
  return pct<=.33?'low':pct<=.66?'medium':pct<=.83?'high':'critical';
};
function renderComparison(){
  animateSwap(()=>{
    view={type:'comparison',family:null}; clearStage();
    document.querySelector('.workspace').classList.add('comparison-mode');
    setBreadcrumb();
    const root=document.createElement('div'); root.className='comparison-view'; stage.appendChild(root);
    root.innerHTML=`
      <div class="comparison-head">
        <div><div class="comparison-title">Comparación y mapa de calor</div><div class="comparison-subtitle">Prioridad de atención de las 86 políticas propuestas según cobertura, brecha y criticidad.</div></div>
        <div class="result-count" id="comparisonCount"></div>
      </div>
      <div class="comparison-filters">
        <input id="comparisonSearch" type="search" placeholder="Buscar política o documento..." aria-label="Buscar en comparación">
        <select id="familyFilter" aria-label="Filtrar por categoría"><option value="">Todas las categorías</option></select>
        <select id="areaFilter" aria-label="Filtrar por área"><option value="">Todas las áreas</option></select>
        <select id="coverageFilter" aria-label="Filtrar por cobertura"><option value="">Toda la cobertura</option></select>
        <select id="attentionFilter" aria-label="Filtrar por nivel"><option value="">Todos los niveles</option></select>
      </div>
      <div class="heat-wrap"><table class="heat-table"><thead><tr>
        <th>#</th><th>Política propuesta</th><th>Categoría / área</th><th>Cobertura</th><th class="wrap">Brecha</th><th class="wrap">Problema<br>documental</th><th class="wrap">Total</th><th class="wrap">Atención</th>
      </tr></thead><tbody id="heatBody"></tbody></table></div>`;
    const familiesLocal=[...new Set(COMPARISON.map(p=>p.family))].sort((a,b)=>a.localeCompare(b,'es'));
    const areasLocal=[...new Set(COMPARISON.flatMap(p=>String(p.area||'').split('/').map(x=>x.trim()).filter(Boolean)))].sort((a,b)=>a.localeCompare(b,'es'));
    const coverages=[...new Set(COMPARISON.map(p=>p.coverage))];
    const attentions=['Baja','Media','Alta','Crítica'];
    const fill=(id,items)=>{const el=document.getElementById(id);items.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;el.appendChild(o);});};
    fill('familyFilter',familiesLocal); fill('areaFilter',areasLocal); fill('coverageFilter',coverages); fill('attentionFilter',attentions);
    [...document.querySelectorAll('#areaFilter option')].slice(1).forEach(o=>o.textContent=formatAreas(o.value));
    const draw=()=>{
      const q=normalize(document.getElementById('comparisonSearch').value.trim());
      const family=document.getElementById('familyFilter').value, area=document.getElementById('areaFilter').value, coverage=document.getElementById('coverageFilter').value, attention=document.getElementById('attentionFilter').value;
      const rows=COMPARISON.filter(p=>{
        const text=normalize([p.name,p.family,p.area,p.coverage,p.related,p.finding,p.action].join(' '));
        return (!q||text.includes(q))&&(!family||p.family===family)&&(!area||String(p.area).split('/').map(x=>x.trim()).includes(area))&&(!coverage||p.coverage===coverage)&&(!attention||p.attention===attention);
      });
      document.getElementById('comparisonCount').textContent=`${rows.length} de ${COMPARISON.length} políticas`;
      document.getElementById('heatBody').innerHTML=rows.length?rows.map(p=>`
        <tr data-id="${p.id}" tabindex="0" aria-label="Abrir ${esc(p.name)}">
          <td class="num">${p.id}</td><td class="policy-name">${esc(p.name)}</td><td>${esc(p.family)}<br><small>${esc(p.area)}</small></td><td>${esc(p.coverage)}</td>
          <td class="heat-cell ${scoreHeatClass('Brecha',p.gap)}">${p.gap}</td><td class="heat-cell ${scoreHeatClass('Problema documental',p.documental)}">${p.documental}</td><td class="heat-cell ${scoreHeatClass('Puntaje total',p.total)}">${p.total}</td><td><span class="attention ${attentionClass(p.attention)}">${esc(p.attention)}</span></td>
        </tr>`).join(''):'<tr><td colspan="8" class="empty">No se encontraron políticas con esos filtros.</td></tr>';
      document.querySelectorAll('#heatBody tr[data-id]').forEach(row=>{const open=()=>showComparisonPolicy(COMPARISON.find(p=>String(p.id)===row.dataset.id));row.addEventListener('click',open);row.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}});});
    };
    ['comparisonSearch','familyFilter','areaFilter','coverageFilter','attentionFilter'].forEach(id=>document.getElementById(id).addEventListener('input',draw));
    draw();
    document.getElementById('legend').textContent='Comparación visual de cobertura y nivel de atención.';
    document.getElementById('hint').textContent='Selecciona una fila para ver el detalle del cruce';
  });
}
const CRITERIA_INFO={
  'Regulatorio':'Mide qué tan sensible es el tema a obligaciones legales, regulatorias, contractuales o de certificación.',
  'Operativo':'Mide cuánto puede afectar la operación si el tema no está bien definido.',
  'Financiero / reputacional':'Mide el posible efecto económico, fraude, pérdida o daño reputacional.',
  'Criticidad':'Es la suma de los valores Regulatorio, Operativo y Financiero / reputacional.',
  'Brecha':'Mide la distancia entre lo que debería existir y la cobertura actual.',
  'Problema documental':'Mide el nivel de repetición, fragmentación, desactualización o clasificación incorrecta identificado.',
  'Intervención':'Mide la necesidad de actuar sobre la documentación y se obtiene de Brecha + Problema documental.',
  'Puntaje total':'Es la suma de Criticidad + Intervención y ayuda a ordenar la atención.'
};
let criterionTooltip=null;
function ensureCriterionTooltip(){
  if(!criterionTooltip){
    criterionTooltip=document.createElement('div');
    criterionTooltip.id='criterionTooltip';
    criterionTooltip.className='criterion-tooltip';
    criterionTooltip.setAttribute('role','tooltip');
    document.body.appendChild(criterionTooltip);
  }
  return criterionTooltip;
}
function hideCriterionTooltip(){ if(criterionTooltip) criterionTooltip.classList.remove('visible'); }
function showComparisonPolicy(p){
  if(!p)return;
  document.getElementById('detailName').textContent=p.name;
  document.getElementById('detailFamily').textContent=`${p.family} · Cobertura: ${p.coverage}`;
  // El cruce con POLICIES se hace por nombre: POLICIES se renumera al agrupar por familia,
  // por lo que sus id ya no coinciden con los id originales de COMPARISON.
  const target=POLICIES.find(x=>x.name===p.name);
  document.getElementById('detailObjective').textContent=target?.objective||'No se registró el objetivo de esta política.';
  document.getElementById('detailArea').textContent=`${p.area} · Nivel: ${p.attention} · Puntaje: ${p.total}`;
  document.getElementById('detailCoverage').textContent=p.coverage;
  const relatedItems=String(p.related||'No identificado').split(';').map(x=>x.trim()).filter(Boolean);
  document.getElementById('detailRelated').innerHTML=`<ul class="related-list">${relatedItems.map(item=>`<li>${esc(item)}</li>`).join('')}</ul>`;
  document.getElementById('detailFinding').textContent=p.finding||'No se registró una observación adicional para esta política.';
  document.getElementById('detailAction').textContent=p.action||'Sin acción registrada.';
  const scoreItems=[['Regulatorio',p.regulatory],['Operativo',p.operational],['Financiero / reputacional',p.financial],['Criticidad',p.criticality],['Brecha',p.gap],['Problema documental',p.documental],['Intervención',p.intervention],['Puntaje total',p.total]];
  document.getElementById('detailScores').innerHTML=scoreItems.map(([label,value])=>{
    const definition=CRITERIA_INFO[label]||'';
    return `<button type="button" class="criterion-cell ${scoreHeatClass(label,value)}" data-definition="${esc(definition)}" aria-label="${esc(label)}: ${esc(value)}. ${esc(definition)}"><span class="criterion-name">${esc(label)}</span><span class="criterion-value">${esc(value)}</span></button>`;
  }).join('');
  const tooltip=ensureCriterionTooltip();
  const showCriterionTooltip=cell=>{
    tooltip.textContent=cell.dataset.definition||'';
    tooltip.classList.add('visible');
    requestAnimationFrame(()=>{
      const rect=cell.getBoundingClientRect();
      const pad=12,gap=10;
      const width=tooltip.offsetWidth,height=tooltip.offsetHeight;
      let left=rect.left+(rect.width-width)/2;
      left=Math.max(pad,Math.min(left,window.innerWidth-width-pad));
      let top=rect.top-height-gap;
      if(top<pad) top=rect.bottom+gap;
      if(top+height>window.innerHeight-pad) top=Math.max(pad,window.innerHeight-height-pad);
      tooltip.style.left=`${left}px`;
      tooltip.style.top=`${top}px`;
    });
  };
  document.querySelectorAll('#detailScores .criterion-cell').forEach(cell=>{
    cell.addEventListener('mouseenter',()=>showCriterionTooltip(cell));
    cell.addEventListener('mouseleave',hideCriterionTooltip);
    cell.addEventListener('focus',()=>showCriterionTooltip(cell));
    cell.addEventListener('blur',hideCriterionTooltip);
  });
  document.getElementById('comparisonDetails').hidden=false;
  const panel=sidepanel;
  panel.querySelector('.badge').textContent='DETALLE DE COMPARACIÓN';
  panel.classList.add('open'); modalBackdrop.classList.add('open'); document.querySelector('.workspace').classList.add('modal-open');
  setTimeout(()=>document.getElementById('closePanel').focus(),120);
}
function goCategories(){
  animateSwap(()=>{
    view={type:'categories',family:null}; clearStage(); setBreadcrumb();
    const center={x:50,y:50};
    const radiusX=42, radiusY=42;
    const lines=[];
    families.forEach((fam,i)=>{
      const a=(-Math.PI/2)+(i/families.length)*Math.PI*2;
      const x=center.x+Math.cos(a)*radiusX;
      const y=center.y+Math.sin(a)*radiusY;
      const count=POLICIES.filter(p=>p.family===fam).length;
      lines.push([500,310,x*10,y*6.2]);
      makeNode({x,y,title:fam,count,cls:'category',delay:i*18,onClick:()=>goFamily(fam)});
    });
    edgeSvg(lines);
    makeNode({x:50,y:50,title:'CATEGORÍAS',meta:`${families.length} familias`,cls:'center',onClick:()=>{}});
    document.getElementById('legend').textContent='Mapa general de categorías. Cada nodo abre sus políticas objetivo.';
    document.getElementById('hint').textContent='Selecciona una categoría para ver sus políticas';
  });
}
function goFamily(fam){
  animateSwap(()=>{
    view={type:'family',family:fam}; clearStage(); setBreadcrumb();
    const items=POLICIES.filter(p=>p.family===fam);
    const lines=[];
    const n=items.length;
    const rx=n>7?43:38, ry=n>7?40:34;
    items.forEach((p,i)=>{
      const a=(-Math.PI/2)+(i/n)*Math.PI*2;
      const x=50+Math.cos(a)*rx, y=50+Math.sin(a)*ry;
      lines.push([500,310,x*10,y*6.2]);
      makeNode({x,y,title:shortName(p.name),kicker:`Política ${String(p.id).padStart(2,'0')}`,meta:p.area,cls:'policy',delay:i*38,onClick:()=>showPolicy(p)});
    });
    edgeSvg(lines);
    makeNode({x:50,y:50,title:fam,meta:`${n} política${n===1?'':'s'} objetivo`,cls:'center',onClick:()=>{}});
    document.getElementById('legend').textContent=`Categoría seleccionada: ${fam}.`;
    document.getElementById('hint').textContent='Selecciona una política para abrir su objetivo y área sugerida';
  });
}
function showPolicy(p){
  document.querySelector('.workspace').classList.add('modal-open');
  document.getElementById('comparisonDetails').hidden=true;
  sidepanel.querySelector('.badge').textContent='POLÍTICA OBJETIVO';
  document.getElementById('detailName').textContent=p.name;
  document.getElementById('detailFamily').textContent=p.family;
  document.getElementById('detailObjective').textContent=p.objective;
  document.getElementById('detailArea').textContent=p.area;
  modalBackdrop.classList.add('open');
  sidepanel.classList.add('open');
  setTimeout(()=>document.getElementById('closePanel').focus(),120);
}
function closePolicy(){
  sidepanel.classList.remove('open');
  modalBackdrop.classList.remove('open');
  document.querySelector('.workspace').classList.remove('modal-open');
  hideCriterionTooltip();
}
document.getElementById('closePanel').addEventListener('click',closePolicy);
modalBackdrop.addEventListener('click',closePolicy);
document.getElementById('homeBtn').addEventListener('click',goRoot);

searchInput.addEventListener('input',()=>{
  const q=normalize(searchInput.value.trim());
  // La búsqueda toma el primer plano y cierra el detalle abierto para que los resultados no queden debajo de la política.
  if(q && sidepanel.classList.contains('open')) closePolicy();
  if(!q){results.classList.remove('show'); return;}
  const found=POLICIES.filter(p=>normalize(p.name+' '+p.family+' '+p.area).includes(q)).slice(0,12);
  results.innerHTML=found.length?'':'<div class="empty">No se encontraron coincidencias</div>';
  found.forEach(p=>{
    const b=document.createElement('button'); b.type='button'; b.className='result';
    b.innerHTML=`${esc(p.name)}<small>${esc(p.family)} · ${esc(formatAreas(p.area))}</small>`;
    b.addEventListener('click',()=>{searchInput.value='';results.classList.remove('show');goFamily(p.family);setTimeout(()=>showPolicy(p),250)});
    results.appendChild(b);
  });
  results.classList.add('show');
});
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) results.classList.remove('show'); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closePolicy(); results.classList.remove('show'); }});
goRoot();
</script>
